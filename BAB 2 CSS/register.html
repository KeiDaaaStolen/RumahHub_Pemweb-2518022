<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - RumahHub</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo-container">
            <img src="assets/logo.png" alt="Logo" class="logo">
            <span class="brand-title">RUMAHHUB</span>
        </div>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <main class="main-container">
        <div class="auth-wrapper">
            <div class="auth-left">
                <div>
                    <h2>Selamat Datang di RumahHub</h2>
                    <p>Temukan hunian terbaik untuk masa depan terbaik.</p>
                </div>
                <img src="assets/banner_properti3.jpg" alt="Banner Register">
            </div>
            <div class="auth-right">
                <h2>Daftar Akun RumahHub</h2>
                <form action="login.html">
                    <div class="form-group">
                        <label>Nama Lengkap</label>
                        <input type="text" placeholder="Masukkan nama lengkap Anda" required>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" placeholder="Masukkan email aktif Anda" required>
                    </div>
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" placeholder="Buat username" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" placeholder="Buat password" required>
                    </div>
                    <button type="submit" class="btn-submit">Register</button>
                    <div class="auth-link">
                        Sudah punya akun? <a href="login.html">Login Disini</a>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 RumahHub - Katalog Hunian & Properti</p>
    </footer>
</body>
</html>
