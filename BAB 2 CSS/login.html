<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - RumahHub</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo-container">
            <img src="assets/logo.png" alt="Logo" class="logo">
            <span class="brand-title">RUMAHHUB</span>
        </div>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="login.html" class="active">Login</a>
        </nav>
    </header>

    <main class="main-container">
        <div class="auth-wrapper">
            <div class="auth-left">
                <div>
                    <h2>Selamat Datang di RumahHub</h2>
                    <p>Temukan hunian terbaik untuk masa depan terbaik.</p>
                </div>
                <img src="assets/banner_properti1.jpg" alt="Banner Login">
            </div>
            <div class="auth-right">
                <h2>Masuk ke Akun RumahHub</h2>
                <!-- Tombol login menggunakan link agar langsung bisa diklik menuju dashboard -->
                <form>
                    <div class="form-group">
                        <label>Username / Email</label>
                        <input type="text" placeholder="Masukkan username atau email">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" placeholder="Masukkan password">
                    </div>
                    
                    <a href="dashboard.html" class="btn-submit" style="text-align: center; display: block; text-decoration: none; box-sizing: border-box;">Login</a>

                    <div class="auth-link">
                        Belum punya akun? <a href="register.html">Register Disini</a>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 RumahHub - Katalog Hunian & Properti</p>
    </footer>
</body>
</html>
